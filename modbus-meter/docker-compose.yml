services:
  meter:
    build:
      context: .
      dockerfile: Dockerfile.sim
    environment:
      METER_PORT: "502"
    ports:
      - "1502:502"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 502), 2); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      METER_HOST: "meter"
      METER_PORT: "502"
      METER_SLAVE_ID: "1"
      METER_TIMEOUT: "3"
    ports:
      - "8000:8000"
    # 校时全程磁盘流式处理，SQLite 页缓存限 8 MiB；容器硬上限 192 MiB
    mem_limit: 192m
    mem_reservation: 128m
    depends_on:
      meter:
        condition: service_healthy
